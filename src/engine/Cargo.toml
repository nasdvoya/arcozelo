[package]
name = "arcozelo_engine"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "arcozelo_engine"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dotenv = "0.15.0"
askama = "0.12.1"
actix-web = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
actix-cors = "0.7.0"
serde = { version = "1", features = ["derive"]}

[dev-dependencies]
reqwest = "0.11"
